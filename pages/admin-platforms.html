<div class="page-heading">
  <div>
    <p class="eyebrow">COLLECTION MANAGEMENT</p>
    <h1>Manage Platforms</h1>
    <p>Manage the gaming systems in your collection.</p>
  </div>
</div>

<div class="mb-6">
  <button id="admin-add-platform" class="btn-primary px-5 py-3 text-sm">
    + Add Platform
  </button>
</div>

<div class="mb-5">
  <input
    id="platform-search"
    type="search"
    placeholder="Search platforms..."
    class="w-full max-w-md rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
  />
</div>

<div class="game-card overflow-x-auto p-5">
  <table class="w-full text-left text-sm">
    <thead class="border-b border-slate-700 text-slate-400">
      <tr>
        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="name"
        >
          Platform ↕
        </th>
        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="manufacturer"
        >
          Manufacturer ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="release_year"
        >
          Release Year ↕
        </th>
        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="image_url"
        >
          Cover Image ↕
        </th>
        <th class="px-4 py-3 text-right">Actions</th>
      </tr>
    </thead>

    <tbody id="admin-platforms-list"></tbody>
  </table>

  <p id="admin-platforms-empty" class="py-8 text-center text-slate-400" hidden>
    No platforms found.
  </p>
</div>

<div class="page-heading">
  <div>
    <p class="eyebrow" data-i18n="admin_platforms.eyebrow">
      COLLECTION MANAGEMENT
    </p>
    <h1 data-i18n="admin_platforms.title">Manage Platforms</h1>
    <p data-i18n="admin_platforms.subtitle">
      Manage the gaming systems in your collection.
    </p>
  </div>
</div>

<div class="mb-6">
  <button id="admin-add-platform" class="btn-primary px-5 py-3 text-sm">
    + <span data-i18n="admin_platforms.add_platform">Add Platform</span>
  </button>
</div>

<div class="mb-5">
  <input
    id="platform-search"
    type="search"
    placeholder="Search platforms..."
    data-i18n-placeholder="admin_platforms.search_placeholder"
    class="w-full max-w-md rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
  />
</div>

<div class="game-card overflow-x-auto p-5">
  <table class="w-full text-left text-sm">
    <thead class="border-b border-slate-700 text-slate-400">
      <tr>
        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="name"
        >
          <span data-i18n="admin_platforms.column_platform">Platform</span> ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="manufacturer"
        >
          <span data-i18n="admin_platforms.column_manufacturer">
            Manufacturer
          </span>
          ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="release_year"
        >
          <span data-i18n="admin_platforms.column_release_year">
            Release Year
          </span>
          ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="image_url"
        >
          <span data-i18n="admin_platforms.column_cover_image">
            Cover Image
          </span>
          ↕
        </th>

        <th class="px-4 py-3 text-right">
          <span data-i18n="admin_platforms.column_actions">Actions</span>
        </th>
      </tr>
    </thead>

    <tbody id="admin-platforms-list"></tbody>
  </table>

  <p
    id="admin-platforms-empty"
    class="py-8 text-center text-slate-400"
    data-i18n="admin_platforms.empty"
    hidden
  >
    No platforms found.
  </p>
</div>

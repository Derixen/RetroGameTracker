<div class="mb-5 flex flex-wrap items-center justify-start gap-3">
  <!-- Search Platforms -->
  <div class="relative w-72 max-w-full">
    <i
      data-lucide="search"
      class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
    ></i>

    <input
      id="platform-search"
      type="search"
      placeholder="Search platforms..."
      data-i18n-placeholder="platforms.search_placeholder"
      aria-label="Search platforms"
      autocomplete="off"
      class="theme-input w-full py-2 pl-10 pr-3 text-sm"
    />
  </div>

  <!-- Add Platform -->
  <button
    id="platform-add-button"
    type="button"
    class="btn-primary inline-flex shrink-0 items-center gap-2 px-4 py-2 text-sm"
  >
    <i data-lucide="circle-plus" class="h-4 w-4"></i>
    <span data-i18n="platforms.add_platform">Add Platform</span>
  </button>
</div>

<section
  id="platform-grid"
  class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3"
  aria-label="Platforms"
  data-i18n-aria-label="platforms.grid_aria_label"
></section>

<div id="platform-empty" class="empty-state" hidden>
  <div class="empty-icon">🎮</div>

  <h2 data-i18n="platforms.empty_title">No platforms found</h2>

  <p data-i18n="platforms.empty_description">
    Platforms will appear here once they are added to the database.
  </p>
</div>

<!-- ==========================================
     ADD PLATFORM DIALOG
     ========================================== -->

<dialog
  id="platform-add-dialog"
  class="theme-game-dialog w-full max-w-lg rounded-xl p-6 shadow-2xl"
>
  <div class="space-y-5">
    <!-- Header -->
    <div>
      <h2 class="text-xl font-bold">Add Platform</h2>
      <p class="mt-1 text-sm text-slate-400">
        Choose a platform from the official catalog.
      </p>
    </div>

    <!-- Platform Selection -->
    <div>
      <label for="platform-add-select" class="mb-2 block text-sm font-medium">
        Platform
      </label>

      <select id="platform-add-select" class="theme-select w-full">
        <option value="">Select a platform...</option>
      </select>
    </div>

    <!-- Error Message -->
    <p
      id="platform-add-error"
      class="text-sm text-red-400"
      role="alert"
      hidden
    ></p>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-2">
      <button
        id="platform-add-cancel"
        type="button"
        class="btn-secondary px-4 py-2 text-sm"
      >
        Cancel
      </button>

      <button
        id="platform-add-save"
        type="button"
        class="btn-primary px-4 py-2 text-sm"
      >
        Add Platform
      </button>
    </div>
  </div>
</dialog>

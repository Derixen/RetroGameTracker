<div class="page-heading">
  <div>
    <p class="eyebrow">COLLECTION MANAGEMENT</p>
    <h1>Add Game Series</h1>
    <p>Add a new franchise to your retro game collection.</p>
  </div>
</div>

<form
  id="add-series-form"
  class="game-card static-card max-w-2xl space-y-5 p-6"
>
  <div>
    <label for="series-name" class="mb-2 block text-sm font-medium">
      Series Name *
    </label>
    <input
      id="series-name"
      type="text"
      required
      class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
    />
  </div>

  <div>
    <label for="series-description" class="mb-2 block text-sm font-medium">
      Description
    </label>
    <textarea
      id="series-description"
      rows="4"
      class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
    ></textarea>
  </div>

  <p id="series-error" class="text-sm text-red-400" role="alert" hidden></p>

  <div class="flex items-center gap-4">
    <button
      id="save-series"
      type="submit"
      class="rounded-lg bg-pink-500 px-6 py-3 font-semibold text-white transition hover:bg-pink-600"
    >
      Save Series
    </button>

    <a href="#/admin/series" class="text-sm text-slate-400 hover:text-white">
      Cancel
    </a>
  </div>
</form>

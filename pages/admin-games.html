<div class="page-heading">
  <div>
    <p class="eyebrow">COLLECTION MANAGEMENT</p>
    <h1>Manage Games</h1>
    <p>Add, edit, and remove games from your collection.</p>
  </div>
</div>

<div class="mb-6">
  <button
    id="admin-add-game"
    class="rounded-lg bg-pink-500 px-5 py-3 font-semibold text-white transition hover:bg-pink-600"
  >
    + Add Game
  </button>
</div>

<div class="game-card overflow-x-auto p-5">
  <table class="w-full text-left text-sm">
    <thead class="border-b border-slate-700 text-slate-400">
      <tr>
        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="title"
        >
          Title ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="platform"
        >
          Platform ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="year"
        >
          Year ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="developer"
        >
          Developer ↕
        </th>

        <th class="px-4 py-3 text-right">Actions</th>
      </tr>
    </thead>

    <tbody id="admin-games-list"></tbody>
  </table>

  <p id="admin-games-empty" class="py-8 text-center text-slate-400" hidden>
    No games found.
  </p>
</div>

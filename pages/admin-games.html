<div class="page-heading">
  <div>
    <p class="eyebrow" data-i18n="admin_games.eyebrow">COLLECTION MANAGEMENT</p>
    <h1 data-i18n="admin_games.title">Manage Games</h1>
    <p data-i18n="admin_games.subtitle">
      Add, edit, and remove games from your collection.
    </p>
  </div>
</div>

<div class="mb-6">
  <button
    id="admin-add-game"
    class="rounded-lg bg-pink-500 px-5 py-3 font-semibold text-white transition hover:bg-pink-600"
  >
    + <span data-i18n="admin_games.add_game">Add Game</span>
  </button>
</div>

<div class="game-card overflow-x-auto p-5">
  <table class="w-full text-left text-sm">
    <thead class="border-b border-slate-700 text-slate-400">
      <tr>
        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="title"
        >
          <span data-i18n="admin_games.column_title">Title</span> ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="platform"
        >
          <span data-i18n="admin_games.column_platform">Platform</span> ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="year"
        >
          <span data-i18n="admin_games.column_year">Year</span> ↕
        </th>

        <th
          class="px-4 py-3 cursor-pointer select-none hover:text-white"
          data-sort="developer"
        >
          <span data-i18n="admin_games.column_developer">Developer</span> ↕
        </th>

        <th class="px-4 py-3 text-right">
          <span data-i18n="admin_games.column_actions">Actions</span>
        </th>
      </tr>
    </thead>

    <tbody id="admin-games-list"></tbody>
  </table>

  <p
    id="admin-games-empty"
    class="py-8 text-center text-slate-400"
    data-i18n="admin_games.empty"
    hidden
  >
    No games found.
  </p>
</div>

<!-- User Management -->
<section class="game-card static-card mb-8 p-6">
  <div class="mb-6">
    <h2 class="text-xl font-bold text-white" data-i18n="admin_users.title">
      Registered Users
    </h2>
    <p class="mt-1 text-sm text-slate-400" data-i18n="admin_users.description">
      Manage registered accounts, permissions, and user collections.
    </p>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-slate-700 text-slate-400">
        <tr>
          <th class="px-4 py-3" data-i18n="admin_users.column_email">Email</th>
          <th class="px-4 py-3" data-i18n="admin_users.column_registered">
            Registered
          </th>
          <th class="px-4 py-3" data-i18n="admin_users.column_games">Games</th>
          <th class="px-4 py-3" data-i18n="admin_users.column_role">Role</th>
          <th
            class="px-4 py-3 text-right"
            data-i18n="admin_users.column_actions"
          >
            Actions
          </th>
        </tr>
      </thead>

      <tbody id="admin-users-table" class="divide-y divide-slate-700">
        <tr>
          <td
            colspan="5"
            class="px-4 py-8 text-center text-slate-400"
            data-i18n="admin_users.loading"
          >
            Loading users...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<section class="game-card static-card p-6">
  <h2 class="text-xl font-bold text-white" data-i18n="report_bug.title">
    Report a Bug
  </h2>

  <p
    class="mt-4 text-sm leading-7 text-slate-400"
    data-i18n="report_bug.description"
  >
    Found something that isn't working correctly? Help improve RetroTrack Games
    by reporting the issue.
  </p>

  <p
    class="mt-4 text-sm leading-7 text-slate-400"
    data-i18n="report_bug.instructions"
  >
    When reporting a bug, please include what happened, what you expected to
    happen, and the steps needed to reproduce the problem.
  </p>

  <a
    href="#/contact"
    class="mt-6 inline-flex items-center gap-2 font-semibold text-cyan-400 hover:text-cyan-300"
  >
    <i data-lucide="bug" class="h-5 w-5"></i>
    <a
      href="mailto:bugs@retrotrack.games?subject=RetroTrack%20Games%20Bug%20Report"
      data-i18n="report_bug.contact_support"
    >
      Report a Bug
    </a>
  </a>
</section>

<div class="page-heading">
  <div>
    <p class="eyebrow" data-i18n="admin_series.eyebrow">
      COLLECTION MANAGEMENT
    </p>
    <h1 data-i18n="admin_series.title">Manage Game Series</h1>
    <p data-i18n="admin_series.subtitle">
      Manage the franchises in your retro game collection.
    </p>
  </div>
</div>

<div class="mb-6">
  <button id="admin-add-series" class="btn-primary px-5 py-3 text-sm">
    + <span data-i18n="admin_series.add_series">Add Series</span>
  </button>
</div>

<div class="game-card overflow-x-auto p-5">
  <table class="w-full text-left text-sm">
    <thead class="border-b border-slate-700 text-slate-400">
      <tr>
        <th class="px-4 py-3" data-i18n="admin_series.column_series">Series</th>

        <th class="px-4 py-3" data-i18n="admin_series.column_description">
          Description
        </th>

        <th class="px-4 py-3 text-center" data-i18n="admin_series.column_games">
          Games
        </th>

        <th
          class="px-4 py-3 text-right"
          data-i18n="admin_series.column_actions"
        >
          Actions
        </th>
      </tr>
    </thead>

    <tbody id="admin-series-list"></tbody>
  </table>

  <p
    id="admin-series-empty"
    class="py-8 text-center text-slate-400"
    data-i18n="admin_series.empty"
    hidden
  >
    No game series found.
  </p>
</div>

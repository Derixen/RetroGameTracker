<div class="mx-auto max-w-md py-12">
  <div class="game-card p-8">
    <p class="eyebrow" data-i18n="forgot_password.eyebrow">ACCOUNT RECOVERY</p>

    <h1 class="mb-2 text-3xl font-bold" data-i18n="forgot_password.title">
      Reset Password
    </h1>

    <p
      class="mb-8 text-sm text-slate-400"
      data-i18n="forgot_password.description"
    >
      Enter your email address and we'll send you a password reset link.
    </p>

    <form id="forgot-password-form" class="space-y-5">
      <div>
        <label
          for="forgot-password-email"
          class="mb-2 block text-sm font-medium"
          data-i18n="forgot_password.email_label"
        >
          Email
        </label>

        <input
          id="forgot-password-email"
          type="email"
          required
          autocomplete="email"
          class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
        />
      </div>

      <p
        id="forgot-password-message"
        class="text-sm text-slate-400"
        role="status"
        hidden
      ></p>

      <button
        id="forgot-password-submit"
        type="submit"
        class="w-full rounded-lg bg-pink-500 px-4 py-3 font-semibold text-white transition hover:bg-pink-600"
        data-i18n="forgot_password.submit"
      >
        Send Reset Link
      </button>
    </form>

    <div class="mt-6 text-center">
      <a
        href="#/login"
        class="text-sm font-medium text-pink-400 hover:text-pink-300"
        data-i18n="forgot_password.back_to_login"
      >
        Back to Sign In
      </a>
    </div>
  </div>
</div>

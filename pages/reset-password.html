<div class="page-heading">
  <div>
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Reset Password</h1>
    <p>Choose a new password for your account.</p>
  </div>
</div>

<div class="game-card max-w-md p-6">
  <form id="reset-password-form" class="space-y-5">
    <div>
      <label for="reset-new-password" class="mb-2 block text-sm text-slate-400">
        New Password
      </label>
      <input
        id="reset-new-password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
      />
    </div>

    <div>
      <label
        for="reset-confirm-password"
        class="mb-2 block text-sm text-slate-400"
      >
        Confirm New Password
      </label>
      <input
        id="reset-confirm-password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
      />
    </div>

    <button
      id="reset-password-submit"
      type="submit"
      class="w-full cursor-pointer rounded-lg bg-pink-500 px-5 py-3 font-semibold text-white transition hover:bg-pink-600 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Update Password
    </button>
  </form>
</div>

<div class="page-heading">
  <div>
    <p class="eyebrow">THE COLLECTION</p>
    <h1 id="page-title">My Games</h1>
    <p id="page-subtitle">Browse my retro game collection</p>
  </div>
  <div id="game-count" class="count-chip">0 GAMES</div>
</div>
<div id="filter-bar" class="filter-bar">
  <button class="filter-pill selected" data-filter="all">All games</button>
  <button class="filter-pill" data-filter="favorites">Favorites</button>
  <button class="filter-pill" data-filter="completed">Completed</button>
</div>
<section id="game-grid" class="game-grid" aria-label="Games"></section>
<div id="empty-state" class="empty-state" hidden>
  <div class="empty-icon">🎮</div>
  <h2>No games to display yet</h2>
  <p>
    Once your database is connected, your collection will appear here
    automatically.
  </p>
</div>

<div
  id="active-filters"
  class="flex flex-wrap items-center gap-3 mb-5 empty:hidden"
>
  <div id="active-genre-filter" hidden>
    <a
      id="clear-genre-filter"
      href="#/games"
      class="inline-flex items-center gap-2 rounded-lg border border-pink-500/30 bg-pink-500/10 px-4 py-2 text-sm text-pink-400 hover:bg-pink-500/20"
    >
      <span id="active-genre-name"></span>
      <span aria-hidden="true">×</span>
      <span class="sr-only">Clear genre filter</span>
    </a>
  </div>

  <div id="active-platform-filter" hidden>
    <a
      href="#/games"
      class="inline-flex items-center gap-2 rounded-lg border border-pink-500/30 bg-pink-500/10 px-4 py-2 text-sm text-pink-400 hover:bg-pink-500/20"
    >
      <span id="active-platform-name"></span>
      <span aria-hidden="true">×</span>
    </a>
  </div>

  <div id="active-series-filter" hidden>
    <div id="active-developer-filter" hidden>
      <a
        id="clear-developer-filter"
        href="#/games"
        class="inline-flex items-center gap-2 rounded-lg border border-pink-500/30 bg-pink-500/10 px-4 py-2 text-sm text-pink-400 hover:bg-pink-500/20"
      >
        <span id="active-developer-name"></span>
        <span aria-hidden="true">×</span>
        <span class="sr-only">Clear developer filter</span>
      </a>
    </div>

    <a
      id="clear-series-filter"
      href="#/games"
      class="inline-flex items-center gap-2 rounded-lg border border-pink-500/30 bg-pink-500/10 px-4 py-2 text-sm text-pink-400 hover:bg-pink-500/20"
    >
      <span id="active-series-name"></span>
      <span aria-hidden="true">×</span>
    </a>
  </div>
</div>

<div class="mb-6 flex flex-wrap items-center gap-5">
  <!-- Filters: left side -->
  <div id="filter-bar" class="filter-bar !mb-0 !mt-0">
    <button class="filter-pill selected" data-filter="all">All games</button>
    <button class="filter-pill" data-filter="completed">Completed</button>
    <button class="filter-pill" data-filter="in_progress">In Progress</button>
    <button class="filter-pill" data-filter="not_played">Not Played</button>
    <button class="filter-pill" data-filter="favorites">Favorites</button>
  </div>

  <!-- Sorting and view: right side -->
  <div class="flex w-full flex-wrap items-center gap-3 xl:ml-auto xl:w-auto">
    <div class="sort-control">
      <button
        id="game-sort-button"
        type="button"
        class="filter-pill"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <i data-lucide="arrow-down-up"></i>
        <span id="game-sort-label">Title A–Z</span>
        <i data-lucide="chevron-down"></i>
      </button>

      <div id="game-sort-menu" class="sort-menu" hidden>
        <button data-sort="title_asc">Title A–Z</button>
        <button data-sort="title_desc">Title Z–A</button>
        <button data-sort="year_desc">Year: Newest</button>
        <button data-sort="year_asc">Year: Oldest</button>
        <button data-sort="recent">Recently Added</button>
      </div>
    </div>

    <button
      id="game-view"
      type="button"
      class="filter-pill inline-flex items-center gap-2 cursor-pointer"
      aria-label="Change game view"
    >
      <i data-lucide="layout-grid" id="game-view-icon"></i>
      <span id="game-view-label">Large</span>
    </button>
  </div>
</div>
<div class="mb-6 flex flex-wrap items-center gap-3">
  <div class="relative w-full sm:w-[292px]">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>

    <input
      id="game-search"
      type="search"
      placeholder="Search games..."
      data-i18n-placeholder="games.search"
      aria-label="Search games"
      class="w-full rounded-lg border border-slate-700 bg-slate-900 py-2 pl-10 pr-4 text-sm text-white outline-none focus:border-pink-500"
    />
  </div>
  <a
    href="#/admin/add-game"
    class="btn-primary whitespace-nowrap px-4 py-2 text-sm"
  >
    + Add Game
  </a>
</div>
<section id="game-grid" class="game-grid" aria-label="Games"></section>

<!-- List View -->
<div
  id="game-list"
  class="game-card static-card overflow-x-auto"
  aria-label="Games list"
  hidden
>
  <table class="w-full min-w-[600px] text-left text-sm">
    <thead class="border-b border-slate-700 bg-slate-800/50">
      <tr>
        <th class="px-4 py-3 font-semibold text-slate-300">
          <button
            type="button"
            data-list-sort="name"
            class="inline-flex items-center gap-2 hover:text-sky-400"
          >
            Name <i data-lucide="arrow-down-up" class="h-4 w-4"></i>
          </button>
        </th>
        <th class="px-4 py-3 font-semibold text-slate-300">
          <button
            type="button"
            data-list-sort="platform"
            class="inline-flex items-center gap-2 hover:text-sky-400"
          >
            Platform <i data-lucide="arrow-down-up" class="h-4 w-4"></i>
          </button>
        </th>
        <th class="px-4 py-3 font-semibold text-slate-300">
          <button
            type="button"
            data-list-sort="status"
            class="inline-flex items-center gap-2 hover:text-sky-400"
          >
            Status <i data-lucide="arrow-down-up" class="h-4 w-4"></i>
          </button>
        </th>
        <th class="px-4 py-3 font-semibold text-slate-300">
          <button
            type="button"
            data-list-sort="year"
            class="inline-flex items-center gap-2 hover:text-sky-400"
          >
            Year <i data-lucide="arrow-down-up" class="h-4 w-4"></i>
          </button>
        </th>
      </tr>
    </thead>
    <tbody id="game-list-body" class="divide-y divide-slate-700/50"></tbody>
  </table>
</div>

<div id="empty-state" class="empty-state" hidden>
  <div class="empty-icon">🎮</div>
  <h2>No games to display yet</h2>
  <p>
    Your collection is empty. Start adding games to build your retro game
    library!
  </p>
</div>

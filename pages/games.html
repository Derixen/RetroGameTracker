<div
  id="active-filters"
  class="flex flex-wrap items-center gap-3 mb-5 empty:hidden"
>
  <div id="active-genre-filter" hidden>
    <a
      id="clear-genre-filter"
      href="#/games"
      class="inline-flex items-center gap-2 rounded-lg border border-pink-500/30 bg-pink-500/10 px-4 py-2 text-sm text-pink-400 hover:bg-pink-500/20"
    >
      <span id="active-genre-name"></span>
      <span aria-hidden="true">×</span>
      <span class="sr-only">Clear genre filter</span>
    </a>
  </div>

  <div id="active-platform-filter" hidden>
    <a
      href="#/games"
      class="inline-flex items-center gap-2 rounded-lg border border-pink-500/30 bg-pink-500/10 px-4 py-2 text-sm text-pink-400 hover:bg-pink-500/20"
    >
      <span id="active-platform-name"></span>
      <span aria-hidden="true">×</span>
    </a>
  </div>

  <div id="active-series-filter" hidden>
    <div id="active-developer-filter" hidden>
      <a
        id="clear-developer-filter"
        href="#/games"
        class="inline-flex items-center gap-2 rounded-lg border border-pink-500/30 bg-pink-500/10 px-4 py-2 text-sm text-pink-400 hover:bg-pink-500/20"
      >
        <span id="active-developer-name"></span>
        <span aria-hidden="true">×</span>
        <span class="sr-only">Clear developer filter</span>
      </a>
    </div>

    <a
      id="clear-series-filter"
      href="#/games"
      class="inline-flex items-center gap-2 rounded-lg border border-pink-500/30 bg-pink-500/10 px-4 py-2 text-sm text-pink-400 hover:bg-pink-500/20"
    >
      <span id="active-series-name"></span>
      <span aria-hidden="true">×</span>
    </a>
  </div>
</div>

<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
  <!-- Filters: left side -->
  <div id="filter-bar" class="filter-bar !mb-0">
    <button class="filter-pill selected" data-filter="all">All games</button>
    <button class="filter-pill" data-filter="completed">Completed</button>
    <button class="filter-pill" data-filter="in_progress">In Progress</button>
    <button class="filter-pill" data-filter="not_played">Not Played</button>
    <button class="filter-pill" data-filter="favorites">Favorites</button>
  </div>

  <!-- Sorting and view: right side -->
  <div class="flex flex-wrap items-center gap-3">
    <div class="relative">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>

      <input
        id="game-search"
        type="search"
        placeholder="Search games..."
        aria-label="Search games"
        class="w-64 rounded-lg border border-slate-700 bg-slate-900 py-2 pl-10 pr-4 text-sm text-white outline-none focus:border-pink-500"
      />
    </div>
    <label for="game-sort" class="text-sm text-slate-400">Sort:</label>
    <select id="game-sort" class="filter-pill">
      <option value="title_asc">Title A–Z</option>
      <option value="title_desc">Title Z–A</option>
      <option value="year_desc">Year: Newest</option>
      <option value="year_asc">Year: Oldest</option>
      <option value="recent">Recently Added</option>
    </select>

    <label for="game-view" class="text-sm text-slate-400">View:</label>
    <select id="game-view" class="filter-pill">
      <option value="large">Large</option>
      <option value="small">Small</option>
    </select>
  </div>
</div>
<section id="game-grid" class="game-grid" aria-label="Games"></section>
<div id="empty-state" class="empty-state" hidden>
  <div class="empty-icon">🎮</div>
  <h2>No games to display yet</h2>
  <p>
    Your collection is empty. Start adding games to build your retro game
    library!
  </p>
</div>

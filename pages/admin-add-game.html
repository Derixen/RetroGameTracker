<div class="page-heading">
  <div>
    <p class="eyebrow">COLLECTION MANAGEMENT</p>
    <h1>Add Game</h1>
    <p>Add a new title to your retro game collection.</p>
  </div>
</div>

<form id="add-game-form" class="game-card max-w-2xl space-y-5 p-6">
  <div>
    <label for="game-title" class="mb-2 block text-sm font-medium">
      Game Title *
    </label>
    <input
      id="game-title"
      type="text"
      required
      class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
    />
  </div>

  <div>
    <label for="game-platform" class="mb-2 block text-sm font-medium">
      Platform *
    </label>
    <select
      id="game-platform"
      required
      class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
    >
      <option value="">Select a platform</option>
    </select>
  </div>

  <div>
    <label for="game-series" class="mb-2 block text-sm font-medium">
      Game Series
    </label>
    <select
      id="game-series"
      class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
    >
      <option value="">No series</option>
    </select>
  </div>

  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
    <div>
      <label for="game-year" class="mb-2 block text-sm font-medium">
        Release Year
      </label>
      <input
        id="game-year"
        type="number"
        min="1970"
        max="2100"
        class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
      />
    </div>

    <div>
      <label for="game-genre" class="mb-2 block text-sm font-medium">
        Genre
      </label>
      <input
        id="game-genre"
        type="text"
        class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
      />
    </div>
  </div>

  <div>
    <label for="game-developer" class="mb-2 block text-sm font-medium">
      Developer
    </label>
    <input
      id="game-developer"
      type="text"
      class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
    />
  </div>

  <div>
    <label for="game-cover" class="mb-2 block text-sm font-medium">
      Cover Image URL
    </label>
    <input
      id="game-cover"
      type="url"
      class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
    />

    <div>
      <label
        for="game-cover-file"
        class="mb-2 block text-sm font-medium text-slate-300"
      >
        Upload Cover Image
      </label>

      <input
        id="game-cover-file"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        class="block w-full cursor-pointer rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-sm text-slate-300 file:mr-4 file:rounded-lg file:border-0 file:bg-pink-500 file:px-4 file:py-2 file:font-semibold file:text-white file:cursor-pointer"
      />

      <p class="mt-2 text-xs text-slate-500">
        JPG, PNG or WebP. Maximum file size: 5 MB.
      </p>

      <img
        id="game-cover-preview"
        alt="Selected game cover preview"
        class="mt-4 max-h-64 max-w-48 rounded-lg object-contain"
        hidden
      />
      <button
        id="remove-game-cover"
        type="button"
        class="mt-3 rounded-lg border border-red-500/40 px-4 py-2 text-sm font-semibold text-red-400 transition hover:bg-red-500/10"
        hidden
      >
        Remove Cover
      </button>
    </div>
  </div>

  <div>
    <label for="game-description" class="mb-2 block text-sm font-medium">
      Description
    </label>
    <textarea
      id="game-description"
      rows="4"
      class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-pink-500"
    ></textarea>
  </div>

  <p id="add-game-error" class="text-sm text-red-400" role="alert" hidden></p>

  <div class="flex items-center gap-4">
    <button
      id="save-game"
      type="submit"
      class="rounded-lg bg-pink-500 px-6 py-3 font-semibold text-white transition hover:bg-pink-600"
    >
      Save Game
    </button>

    <a href="#/admin/games" class="text-sm text-slate-400 hover:text-white">
      Cancel
    </a>
  </div>
</form>
